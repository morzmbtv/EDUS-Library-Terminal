[package]
name = "edus-library-service"
version = "2.0.0-rc.1"
edition = "2021"
rust-version = "1.88"
description = "Loopback Windows service for EDUS Library Edge kiosk"

[[bin]]
name = "EDUSLibraryService"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs", "sync", "io-util"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
uuid = { version = "1.26.1", features = ["v4"] }
edus-library-admin-ipc = { path = "../edus-library-admin-ipc" }
edus-library-core = { path = "../edus-library-core" }
windows-service = "0.8.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"



