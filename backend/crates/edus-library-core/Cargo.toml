[package]
name = "edus-library-core"
version = "2.0.0-rc.1"
edition = "2021"
rust-version = "1.88"
description = "Shared local-first domain and SQLCipher core for EDUS Library"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
rand = "0.9"
sha2 = "0.10"
hmac = "0.12"
ureq = { version = "3.1", default-features = false, features = ["json", "rustls"] }
url = "2.5"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "backup", "chrono", "uuid", "serde_json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"


