[package]
name = "edus-library-configurator"
version = "2.0.0-rc.1"
edition = "2021"
build = "build.rs"

[[bin]]
name = "EDUSTerminalConfigurator"
path = "src/main.rs"
test = false

[dependencies]
edus-library-admin-ipc = { path = "../edus-library-admin-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "rt"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Services", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }
