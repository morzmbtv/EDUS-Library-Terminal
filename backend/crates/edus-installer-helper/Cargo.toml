[package]
name = "edus-installer-helper"
version = "2.0.0-rc.1"
edition = "2021"

[[bin]]
name = "EDUSInstallerHelper"
path = "src/main.rs"

[dependencies]
windows-service = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Services", "Win32_System_Environment", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

